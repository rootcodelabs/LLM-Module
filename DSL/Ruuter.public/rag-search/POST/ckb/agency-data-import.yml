declaration:
  call: declare
  version: 0.1
  description: "Get agency data from CKB import endpoint"
  method: post
  accepts: json
  returns: json
  namespace: rag-search

get_agency_data:
  call: http.get
  args:
    url: "[#CKB_RUUTER_INTERNAL]/client/data/import"
  result: agency_data_info
  next: return_result

return_result:
  return: ${agency_data_info.response.body}
  next: end