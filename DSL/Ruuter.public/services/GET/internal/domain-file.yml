declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'DOMAIN-FILE'"
  method: get
  accepts: json
  returns: json
  namespace: service
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

getFileLocations:
  call: http.get
  args:
    url: "[#SERVICE_RUUTER]/internal/return-file-locations"
    headers:
      cookie: ${incoming.headers.cookie}
  result: fileLocations

getDomainFile:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/file-manager/read-file"
    body:
      file_path: ${fileLocations.response.body.response.domain_location}
  result: domainFile

convertYamlToJson:
  call: http.post
  args:
    url: "[#SERVICE_DMAPPER]/conversion/yaml_to_json"
    body:
      file: ${domainFile.response.body.file}
  result: domainData

return_value:
  return: ${domainData.response.body}
