# Docker Compose override for LLM Orchestration Service development
# Use: docker-compose -f docker-compose.yml -f docker-compose.llm-dev.yml up

version: '3.8'

services:
  llm-orchestration-service:
    build:
      context: .
      dockerfile: Dockerfile.llm_orchestration_service
      target: runtime
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app/src
    volumes:
      # Mount source code for development (hot reload if needed)
      - ./src:/app/src
      # Mount configuration files
      - ./src/llm_config_module/config:/app/src/llm_config_module/config:ro
      # Mount logs for easier debugging
      - ./logs:/app/logs
    command: >
      uvicorn src.llm_orchestration_service_api:app
      --host 0.0.0.0 
      --port 8100 
      --reload
      --reload-dir /app/src
    ports:
      - "8100:8100"
    depends_on:
      - vault
    networks:
      - bykstack
