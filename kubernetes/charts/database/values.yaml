# Centralized database configuration using pure PostgreSQL
databases:
  - name: rag-search-db
    username: postgres
    password: "{{ ragSearchDB.password }}" 
    db: rag-search
    storage: 8Gi
  - name: tim-postgresql
    username: tim
    password: "{{ TIMDB.password }}"  
    db: tim
    storage: 1Gi

image:
  repository: postgres
  tag: "14.1"
  pullPolicy: IfNotPresent

service:
  port: 5432

persistence:
  storageClass: ""  # specify your own
  accessModes: ["ReadWriteOnce"]

