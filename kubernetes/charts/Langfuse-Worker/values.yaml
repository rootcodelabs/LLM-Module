replicas: 1
enabled: true

images:
  langfuse_worker:
    registry: "docker.io"
    repository: "langfuse/langfuse-worker"
    tag: "3"

release_name: "langfuse-worker"

service:
  type: ClusterIP
  port: 3030

# Environment variables 
env:
  # Database configuration
  NEXTAUTH_URL: "http://localhost:3000"
  DATABASE_URL: "postgresql://postgres:dbadmin@rag_search_db:5432/rag-search"
  SALT: "changeme"
  ENCRYPTION_KEY: "changeme"
  TELEMETRY_ENABLED: "true"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
  
  # ClickHouse configuration
  CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: "clickhouse"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  
  # S3/MinIO configuration
  LANGFUSE_USE_AZURE_BLOB: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "rag-search"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "changeme"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "changeme"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "langfuse/events/"
  
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "rag-search"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "auto"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "changeme"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "changeme"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "langfuse/media/"
  
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: "rag-search"
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: "langfuse/exports/"
  LANGFUSE_S3_BATCH_EXPORT_REGION: "auto"
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: "changeme"
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: "changeme"
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: ""
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: ""
  
  # Redis configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_AUTH: "myredissecret"
  REDIS_TLS_ENABLED: "false"
  REDIS_TLS_CA: ""
  REDIS_TLS_CERT: ""
  REDIS_TLS_KEY: ""
  
  # Email configuration
  EMAIL_FROM_ADDRESS: ""
  SMTP_CONNECTION_URL: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "500m"

pullPolicy: IfNotPresent

healthcheck:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3