apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-llm-config
  labels:
    app: vault-agent-llm
    component: vault-agent
data:
  agent.hcl: |
    # Vault Agent Configuration for LLM Orchestration Service

    vault {
      address = "http://vault:8200"
      retry {
        num_retries = 5
      }
    }
    
    auto_auth {
      method "approle" {
        mount_path = "auth/approle"
        config = {
          role_id_file_path   = "/agent/credentials/llm_role_id"
          secret_id_file_path = "/agent/credentials/llm_secret_id"
          remove_secret_id_file_after_reading = false
        }
      }
      
      # Write token to shared volume for agent to use
      sink "file" {
        config = {
          path = "/agent/llm-token/token"
          mode = 0640
        }
      }
    }
    
    # Caching configuration for LLM (longer TTL)
    cache {
      default_lease_duration = "1h"
    }
    
    listener "tcp" {
      address     = "0.0.0.0:8201"
      tls_disable = true
    }
    
    api_proxy {
      use_auto_auth_token = true
      enforce_consistency = "always"
      when_inconsistent = "forward"
    }
