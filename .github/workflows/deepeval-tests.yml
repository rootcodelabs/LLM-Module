name: DeepEval RAG System Tests

on:
  push:
    branches:
      - deep-eval-bimsara
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deepeval-tests.yml'

  pull_request:
    branches:
      - deep-eval-bimsara
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deepeval-tests.yml'

jobs:
  deepeval-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies (locked)
      run: uv sync --frozen

    - name: Print first 3 characters of secrets (for debug)
      run: |
        echo "AZURE_MODEL_API_KEY starts with: ${AZURE_MODEL_API_KEY:0:3}"
        echo "AZURE_MODEL_ENDPOINT starts with: ${AZURE_MODEL_ENDPOINT:0:3}"
      env:
        AZURE_MODEL_API_KEY: ${{ secrets.AZURE_MODEL_API_KEY }}
        AZURE_MODEL_ENDPOINT: ${{ secrets.AZURE_MODEL_ENDPOINT }}

    - name: Run DeepEval tests
      id: run_tests
      continue-on-error: true
      env:
        AZURE_MODEL_API_KEY: ${{ secrets.AZURE_MODEL_API_KEY }}
        AZURE_MODEL_ENDPOINT: ${{ secrets.AZURE_MODEL_ENDPOINT }}
      run: |
        cd tests
        uv run python -m pytest test_orchestration_api.py -v --tb=short
        echo "PYTEST_EXIT_CODE=$?" >> $GITHUB_ENV

    - name: Generate evaluation report
      id: generate_report
      run: |
        cd tests
        uv run python deepeval_tests/report_generator.py

    - name: Read test report
      id: read_report
      run: |
        if [ -f "tests/test_report.md" ]; then
          echo "REPORT_EXISTS=true" >> $GITHUB_ENV
          echo "REPORT_CONTENT<<EOF" >> $GITHUB_ENV
          cat tests/test_report.md | base64 -w 0 >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        else
          echo "REPORT_EXISTS=false" >> $GITHUB_ENV
          echo "REPORT_CONTENT=Report file not found" >> $GITHUB_ENV
        fi

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && env.REPORT_EXISTS == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const reportContent = Buffer.from(process.env.REPORT_CONTENT, 'base64').toString('utf-8');
          
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });

          const existingComment = comments.data.find(
            comment => comment.user.login === 'github-actions[bot]' &&
                       comment.body.includes('RAG System Evaluation Report')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: reportContent
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reportContent
            });
          }

    - name: Set job status
      run: |
        if [ "$PYTEST_EXIT_CODE" -eq "0" ]; then
          echo "All tests passed"
          exit 0
        else
          echo "Some tests failed"
          exit 1
        fi
