# Vector Indexer Configuration
vector_indexer:
  # API Configuration
  api:
    base_url: "http://llm-orchestration-service:8100"
    qdrant_url: "http://qdrant:6333"
    timeout: 300  # seconds

  # Processing Configuration (MERGED - only one processing section)
  processing:
    # Environment settings
    environment: "production"  # Change to "test" for testing
    connection_id: null  # Set to "evalconnection-1" for testing
    
    # Processing timing
    batch_delay_seconds: 0.1
    context_delay_seconds: 0.05
    
    # Provider Detection
    provider_detection_patterns:
      openai: ['\bGPT\b', '\bOpenAI\b', '\btext-embedding\b', '\bada\b']
      aws_bedrock: ['\btitan\b', '\bamazon\b', '\bbedrock\b']
      azure_openai: ['\bazure\b', '\btext-embedding-3\b', '\bada-002\b']

  # Chunking Configuration
  chunking:
    chunk_size: 800  # tokens
    chunk_overlap: 100  # tokens
    min_chunk_size: 50
    max_chunk_size: 2000
    chars_per_token: 4
    tokenizer_encoding: "cl100k_base"
    
    # Templates
    templates:
      chunk_id_pattern: "{document_hash}_chunk_{index:03d}"
      context_separator: "\n\n--- Chunk {chunk_id} ---\n\n"
    
    # Quality validation
    min_word_count: 5
    max_whitespace_ratio: 0.8
    max_repetition_ratio: 0.5

  # Concurrency Configuration
  concurrency:
    max_concurrent_documents: 3
    max_concurrent_chunks_per_doc: 5

  # Batch Configuration
  batching:
    embedding_batch_size: 10
    context_batch_size: 5

  # Error Handling
  error_handling:
    max_retries: 3
    retry_delay_base: 2
    continue_on_failure: true
    log_failures: true

  # Logging Configuration
  logging:
    level: "INFO"
    failure_log_file: "logs/vector_indexer_failures.jsonl"
    processing_log_file: "logs/vector_indexer_processing.log"
    stats_log_file: "logs/vector_indexer_stats.json"

  # Dataset Configuration
  dataset:
    base_path: "datasets"
    supported_extensions: [".txt"]
    metadata_file: "source.meta.json"
    target_file: "cleaned.txt"

  # Document Loader Configuration
  document_loader:
    target_file: "cleaned.txt"
    metadata_file: "source.meta.json"
    min_content_length: 10
    max_content_length: 10000000
    encoding: "utf-8"
    required_metadata_fields:
      - "source_url"
    enable_content_caching: false
    max_scan_depth: 5
    min_file_size_bytes: 1
    max_file_size_bytes: 50000000

  # Diff Identifier Configuration
  diff_identifier:
    datasets_path: "datasets"
    metadata_filename: "processed-metadata.json"
    max_retries: 3
    max_delay_seconds: 8