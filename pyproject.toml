[project]
name = "rag-module"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "azure-identity>=1.24.0",
    "boto3>=1.40.25",
    "dspy>=3.0.3",
    "openai>=1.106.1",
    "numpy>=2.3.2",
    "pre-commit>=4.3.0",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "ruff>=0.12.12",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "pydantic>=2.11.7",
    "testcontainers>=4.13.0",
    "hvac>=2.3.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "qdrant-client>=1.15.1",
    "rank-bm25>=0.2.2",
    "deepeval>=3.6.0",
    "deepteam>=0.2.5",
    "rerankers>=0.10.0",
    "deepeval>=3.6.0",
    "pytest-json-report>=1.5.0",
    "deepteam>=0.2.5",
    "anthropic>=0.69.0",
    "nemoguardrails>=0.16.0",
    "tiktoken>=0.11.0",
    "langfuse>=3.8.1",
]

[tool.ruff]
lint.select = ["ANN"]




[tool.pyright]
# --- Environment & discovery ---
pythonVersion = "3.12.10"          # Target Python semantics (pattern matching, typing features, stdlib types).
venvPath = "."                   # Where virtual envs live relative to repo root.
venv = ".venv"                   # The specific env name uv manages (uv sync creates .venv).

# --- What to analyze ---
include = ["*"]       # Top-level packages & tests to check.
exclude = [
  "**/.venv", "**/__pycache__", "build", "dist", ".git",
  ".ruff_cache", ".mypy_cache"
]

# --- Global strictness ---
typeCheckingMode = "standard"      # Enforce full standard stubs, inspect its code to infer types where possible.
 